services:
  db:
    image: postgres:18-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fastapi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: local_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      # Disables the login page (runs in Desktop Mode)
      PGADMIN_CONFIG_SERVER_MODE: "False" 
      # Disables the master password creation prompt
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Mount the servers.json auto-configuration file
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres_data:
  pgadmin_data: